name: LockIn notifications
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency: { group: notify, cancel-in-progress: false }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
        working-directory: notify
      - run: node notify.js
        working-directory: notify
